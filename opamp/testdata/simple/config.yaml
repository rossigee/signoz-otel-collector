receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:0
      http:
        endpoint: localhost:0
processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
extensions:
  zpages:
    endpoint: localhost:0
exporters:
  debug: null
service:
  extensions: [zpages]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
